# pi-mini-boss — конфигурация агента
#
# Что можно менять (пользователь): role, purpose, language, recommended_extensions.
# Что не трогать (ядро модуля): base_behavior, required_extensions, workflow, thinking —
#   они обновляются вместе с версией пакета.
# Личные НАВСЕГДА-правила добавляй отдельно через /memory-pin (STANDING.md) —
#   конфиг модуля и личные пины не смешиваются.

role:
  name: "senior backend developer"        # кто ты
  purpose: "развивать marketplace-платформу"  # чем занимаешься
  language: ru                            # язык общения
  # Опциональный профиль роли (применяется на старте сессии):
  # model: deepseek/deepseek-flash        # provider/modelId
  # thinking: low                         # off|minimal|low|medium|high|xhigh|max
  # tools: [read, bash, edit, write, grep, find, ls, task, ask]  # allowlist активных инструментов

# Универсальные правила поведения — без стека и домена (те — в AGENTS.md проекта).
base_behavior:
  - читай AGENTS.md/CLAUDE.md проекта первым и следуй его конвенциям
  - сборка и тесты проходят чисто — без предупреждений и ошибок
  - ожидаемые ошибки обрабатывай явно, не через исключения
  - проверяй, что правка реально легла в файл (не доверяй вызову edit)
  - авторитетны сборка и тесты, а не диагностика IDE/LSP
  - минимальный diff — не переусложняй
  - обновляй статус задачи в ТОМ ЖЕ шаге, где сделана работа (начал → in_progress, сделал → completed) — пользователь никогда не должен видеть устаревшие статусы

# Проверяется на старте: нет — ошибка и предложение установить.
# Ядро (память, задачи) встроено в сам pi-mini-boss, поэтому внешних обязательных нет.
required_extensions: []

# Предлагается установить, с объяснением «зачем».
# Рекомендуемые и опциональные расширения. `group` → отдельная вкладка в онбординге;
# `selected: false` = опциональное (без галочки по умолчанию).
recommended_extensions:
  # Контекст и сессии
  - { name: billion-context-pi, why: "сжатие контекста, длинные сессии", group: Контекст }
  - { name: pi-cache-optimizer, why: "кэш промптов и статистика в футере", group: Контекст, selected: false }
  - { name: pi-posthorse, why: "смена контекста без суммаризации", group: Контекст, selected: false }
  - { name: context-mode, why: "песочница + FTS5-база знаний", group: Контекст, selected: false }
  - { name: "@moyai/pi-session-hoarder", why: "архивация сессий", group: Контекст, selected: false }
  - { name: pi-btw, why: "побочные вопросы в стороне", group: Контекст, selected: false }

  # Качество
  - { name: ponytail, why: "лаконичный режим, меньше токенов", group: Качество }
  - { name: pi-simplify, why: "ревью свежих правок на ясность", group: Качество, selected: false }
  - { name: "@plannotator/pi-extension", why: "ревью плана и PR с аннотациями", group: Качество, selected: false }
  - { name: pi-lens, why: "LSP/линтеры (может давать ложные ошибки)", group: Качество, selected: false }

  # Безопасность
  - { name: cc-safety-net, why: "блокировка разрушительных команд и секретов", group: Безопасность, selected: false }
  - { name: "@gotgenes/pi-permission-system", why: "система прав и подтверждений", group: Безопасность, selected: false }

  # Планирование
  - { name: pi-goal-x, why: "постоянные цели агента", group: Планирование }
  - { name: "@narumitw/pi-plan-mode", why: "read-only режим планирования", group: Планирование, selected: false }

  # UI
  - { name: pi-powerline-footer, why: "powerline-статусбар", group: UI, selected: false }
  - { name: pi-autosuggestions, why: "ghost-подсказки в редакторе", group: UI, selected: false }

  # Поиск и интеграции
  - { name: pi-web-access, why: "доступ в интернет (web_search, fetch_content)", group: Поиск }
  - { name: "@ff-labs/pi-fff", why: "быстрый нечёткий поиск", group: Поиск, selected: false }
  - { name: pi-web-search, why: "нативный поиск провайдера", group: Поиск, selected: false }
  - { name: pi-mcp-adapter, why: "подключение MCP-серверов", group: Поиск, selected: false }
  - { name: "@onkernel/browser-loop", why: "браузерные инструменты для агента", group: Поиск, selected: false }

  # Наблюдаемость
  - { name: "@langfuse/pi-observability-plugin", why: "трейсинг в Langfuse", group: Наблюдаемость, selected: false }
  - { name: "@langchain/langsmith-pi-extension", why: "трейсинг в LangSmith", group: Наблюдаемость, selected: false }
  - { name: "@raindrop-ai/pi-agent", why: "трейсинг в Raindrop", group: Наблюдаемость, selected: false }

  # Делегирование
  - { name: pi-subagents, why: "делегирование и параллельные субагенты", group: Делегирование }
  - { name: pi-background-tasks, why: "долгие команды в фоне", group: Делегирование }
  - { name: "@tintinweb/pi-subagents", why: "субагенты «как в Claude Code»", group: Делегирование, selected: false }
  - { name: pi-advisor-flow, why: "схема Исполнитель/Советник", group: Делегирование, selected: false }
  - { name: "@akagilnc/pi-workflow-roles", why: "роли под workflow", group: Делегирование, selected: false }

# Порядок ведения задачи.
workflow:
  - plan
  - do
  - verify
  - close

# Сколько рассуждений генерировать и показывать (мапится на Pi defaultThinkingLevel / hideThinkingBlock).
thinking:
  level: low
  hide: true
