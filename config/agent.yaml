  - { name: billion-context-pi, why: "сжатие контекста, длинные сессии", group: Контекст }
  - { name: pi-cache-optimizer, why: "кэш промптов и статистика в футере", group: Контекст }
  - { name: pi-posthorse, why: "смена контекста без суммаризации", group: Контекст, selected: false }
  - { name: context-mode, why: "работа с контекстом и памятью сессии", group: Контекст, selected: false }
  - { name: "@moyai/pi-session-hoarder", why: "хранение и поиск прошлых сессий", group: Контекст, selected: false }
  - { name: pi-btw, why: "побочные вопросы в стороне", group: Контекст, selected: false }
  - { name: pi-blackhole, why: "компакция + наблюдательная память", group: Контекст, selected: false }
  - { name: pi-context-view, why: "визуализация расхода контекста и скрытого промпта", group: Контекст }
